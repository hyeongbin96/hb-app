<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>칸반 보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>칸반 보드</h1>
    <div id="mascots" class="mascots" aria-hidden="true">
      <img src="img/chiikawa.png" alt="">
      <img src="img/momonga.png" alt="">
      <img src="img/usagi.png" alt="">
      <span id="mood-bubble" class="mood-bubble" hidden></span>
    </div>
    <div class="top-actions">
      <button id="nickname" type="button" class="nick" title="닉네임 바꾸기"></button>
      <button id="export" type="button" title="JSON 파일로 내보내기">⬇ 내보내기</button>
      <label class="btn" title="JSON 파일 가져오기">⬆ 가져오기
        <input id="import" type="file" accept="application/json,.json" hidden>
      </label>
      <button id="add-column" type="button" class="primary">+ 컬럼 추가</button>
    </div>
  </header>

  <nav class="toolbar">
    <div class="search">
      <span aria-hidden="true">🔍</span>
      <input id="search" type="search" placeholder="카드 검색  ( / )">
    </div>
    <select id="filter-label" aria-label="라벨 필터">
      <option value="">모든 라벨</option>
    </select>
    <select id="filter-priority" aria-label="우선순위 필터">
      <option value="">모든 우선순위</option>
    </select>
    <button id="clear-filters" type="button" hidden>필터 지우기</button>
    <span id="summary" class="summary"></span>
    <span id="sync" class="sync"></span>
  </nav>

  <main id="board" class="board"></main>

  <dialog id="card-dialog">
    <form method="dialog" id="card-form">
      <h2 id="dialog-title">카드</h2>

      <label class="field">제목
        <input id="card-title" type="text" required maxlength="100">
      </label>
      <label class="field">설명
        <textarea id="card-desc" rows="3" maxlength="1000"></textarea>
      </label>

      <div class="field-row">
        <label class="field">우선순위
          <select id="card-priority">
            <option value="">없음</option>
          </select>
        </label>
        <label class="field">마감일
          <input id="card-due" type="date">
        </label>
      </div>

      <div class="field">라벨
        <div id="label-picker" class="label-picker"></div>
      </div>

      <div class="field">
        <div class="check-head">
          <span>체크리스트</span>
          <span id="check-count" class="check-count"></span>
        </div>
        <div class="progress"><div id="check-progress"></div></div>
        <ul id="checklist" class="checklist"></ul>
        <div class="check-add">
          <input id="check-input" type="text" maxlength="200" placeholder="항목 추가 후 Enter">
          <button type="button" id="check-add">추가</button>
        </div>
      </div>

      <div class="field">
        <div class="check-head">
          <span>댓글</span>
          <span id="comment-count" class="check-count"></span>
        </div>
        <ul id="comments" class="comments"></ul>
        <p id="comment-hint" class="hint">카드를 저장한 뒤 댓글을 달 수 있어요</p>
        <div id="comment-form" class="comment-add">
          <textarea id="comment-input" rows="2" maxlength="500" placeholder="댓글 입력 (Enter 등록 · Shift+Enter 줄바꿈)"></textarea>
          <button type="button" id="comment-add" class="primary">등록</button>
        </div>
      </div>

      <div class="dialog-actions">
        <button type="button" id="card-delete" class="danger">삭제</button>
        <span class="spacer"></span>
        <button type="button" id="card-cancel">취소</button>
        <button type="submit" class="primary">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="nick-dialog" class="nick-dialog">
    <form method="dialog" id="nick-form">
      <h2>닉네임을 정해 주세요</h2>
      <p class="hint">댓글에 이 이름이 표시돼요. 언제든 바꿀 수 있어요.</p>
      <label class="field">
        <input id="nick-input" type="text" required maxlength="20" placeholder="예: 치이카와">
      </label>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="submit" class="primary">확인</button>
      </div>
    </form>
  </dialog>

  <div id="pet-yard" class="pet-yard">
    <div id="weather-layer" class="weather-layer" aria-hidden="true"></div>
    <span id="snowman" class="snowman" aria-hidden="true">⛄</span>
    <div id="pet-house" class="pet-house" aria-hidden="true">
      <span class="pet-zzz">💤</span>
      <span class="pet-zzz late">💤</span>
      <svg viewBox="0 0 100 96" xmlns="http://www.w3.org/2000/svg">
        <rect x="66" y="10" width="11" height="22" rx="3" fill="#e8a0b4" stroke="#6b5b6e" stroke-width="2.5"/>
        <rect x="16" y="42" width="68" height="46" rx="10" fill="#fff4e0" stroke="#6b5b6e" stroke-width="2.5"/>
        <path d="M8 48 L50 12 L92 48 Q94 52 89 53 L11 53 Q6 52 8 48 Z" fill="#ff9db8" stroke="#6b5b6e" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="50" cy="34" r="6" fill="#fff" stroke="#6b5b6e" stroke-width="2"/>
        <path d="M50 37 l-3 -3 a2 2 0 0 1 3 -2.5 a2 2 0 0 1 3 2.5 z" fill="#ff7c9c"/>
        <path d="M40 88 V70 a10 10 0 0 1 20 0 V88" fill="#c99a78" stroke="#6b5b6e" stroke-width="2.5"/>
        <circle cx="55" cy="78" r="1.6" fill="#6b5b6e"/>
        <rect x="22" y="60" width="12" height="12" rx="3" fill="#d6ecff" stroke="#6b5b6e" stroke-width="2"/>
        <rect x="66" y="60" width="12" height="12" rx="3" fill="#d6ecff" stroke="#6b5b6e" stroke-width="2"/>
        <circle cx="10" cy="86" r="4" fill="#ffd6e0" stroke="#6b5b6e" stroke-width="1.5"/>
        <circle cx="10" cy="86" r="1.5" fill="#ffe17a"/>
        <circle cx="92" cy="85" r="4" fill="#fff2b8" stroke="#6b5b6e" stroke-width="1.5"/>
        <circle cx="92" cy="85" r="1.5" fill="#ff9db8"/>
      </svg>
      <span class="pet-sign">먼작귀네 <span id="pet-meals"></span></span>
    </div>
    <!-- 치이카와·우사기·모몽가는 app.js가 여기에 만든다 -->
    <div id="pets"></div>
  </div>

  <aside id="presence" class="presence" hidden>
    <div class="presence-head">
      <button type="button" id="presence-toggle" class="presence-title">👑 접속자 <span id="presence-count"></span></button>
      <button type="button" id="admin-logout" class="icon-btn" title="관리자 모드 끄기">✕</button>
    </div>
    <ul id="presence-list" class="presence-list"></ul>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
